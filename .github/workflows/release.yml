name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify stable release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
      - run: node scripts/validate-release-version.mjs "${{ github.ref_name }}"

  build:
    name: Build ${{ matrix.platform }}
    needs: verify-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-aarch64
            rust_target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: darwin-x86_64
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            platform: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - run: npm ci
      - name: Build macOS with ad-hoc signing
        if: runner.os == 'macOS'
        run: npm run tauri build -- --target ${{ matrix.rust_target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
      - name: Build Windows
        if: runner.os == 'Windows'
        run: npm run tauri build -- --target ${{ matrix.rust_target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: node scripts/prepare-release-asset.mjs --platform ${{ matrix.platform }} --version ${{ github.ref_name }} --source-dir src-tauri/target/${{ matrix.rust_target }}/release/bundle
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
      - run: node scripts/create-release-manifest.mjs --version "${{ github.ref_name }}" --tag "${{ github.ref_name }}" --repository "${{ github.repository }}" --asset-dir release-artifacts --output release-artifacts/latest.json
      - name: Verify release assets
        run: |
          test "$(find release-artifacts -type f -name '*.sig' | wc -l | tr -d ' ')" -eq 3
          test "$(find release-artifacts -type f \( -name '*.app.tar.gz' -o -name '*-setup.exe' \) | wc -l | tr -d ' ')" -eq 3
          test "$(find release-artifacts -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 2
          test -f release-artifacts/latest.json
      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" release-artifacts/*/* release-artifacts/latest.json --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
